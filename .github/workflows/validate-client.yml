name: Validate Mall4j Client

on:
  workflow_dispatch:
  push:
    branches:
      - develop/android-foundation
    paths:
      - ".github/workflows/validate-client.yml"
      - "mobile/**"
      - "infra/**"

permissions:
  contents: read

concurrency:
  group: mall4j-client-validation-retry-20261112
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout app configuration
        uses: actions/checkout@v4

      - name: Checkout upstream Mall4j
        uses: actions/checkout@v4
        with:
          repository: gz-yami/mall4j
          ref: c69b6793ef2c7f528c5e7364aecd22f0b9f7209f
          path: mall4j-upstream

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install uni-app dependencies
        working-directory: mall4j-upstream/front-end/mall4uni
        run: pnpm install --no-frozen-lockfile

      - name: Lint client source
        working-directory: mall4j-upstream/front-end/mall4uni
        run: pnpm run lint

      - name: Build H5 validation bundle
        working-directory: mall4j-upstream/front-end/mall4uni
        run: pnpm run build:h5

  validate-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout app configuration
        uses: actions/checkout@v4

      - name: Checkout upstream Mall4j
        uses: actions/checkout@v4
        with:
          repository: gz-yami/mall4j
          ref: c69b6793ef2c7f528c5e7364aecd22f0b9f7209f
          path: mall4j-upstream

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install admin frontend dependencies
        working-directory: mall4j-upstream/front-end/mall4v
        run: pnpm install --no-frozen-lockfile

      - name: Lint admin frontend
        working-directory: mall4j-upstream/front-end/mall4v
        run: pnpm run lint

      - name: Build admin frontend
        working-directory: mall4j-upstream/front-end/mall4v
        env:
          VITE_APP_BASE_API: https://admin-api.example.invalid
          VITE_APP_RESOURCES_URL: https://admin-api.example.invalid/mall4j/img/
        run: pnpm run build

  validate-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout app configuration
        uses: actions/checkout@v4

      - name: Validate deployment shell script
        run: for script in infra/*.sh; do bash -n "$script"; done

      - name: Validate production patcher syntax
        run: python3 -m py_compile infra/configure-upstream.py

      - name: Validate Docker Compose configuration
        run: docker compose --env-file infra/.env.production.example -f infra/docker-compose.production.yml config --quiet

  validate-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout app configuration
        uses: actions/checkout@v4
        with:
          path: app-config

      - name: Checkout upstream Mall4j
        uses: actions/checkout@v4
        with:
          repository: gz-yami/mall4j
          ref: c69b6793ef2c7f528c5e7364aecd22f0b9f7209f
          path: mall4j-upstream

      - name: Configure production backend settings
        run: python3 app-config/infra/configure-upstream.py mall4j-upstream https://media.test/mall4j/img/ 0123456789abcdef0123456789abcdef https://admin.test

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile backend modules
        working-directory: mall4j-upstream
        run: mvn -B -DskipTests package
