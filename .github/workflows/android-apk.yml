name: Build Mall4j Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mall4j-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout app configuration
        uses: actions/checkout@v4

      - name: Checkout Mall4j upstream
        uses: actions/checkout@v4
        with:
          repository: gz-yami/mall4j
          ref: c69b6793ef2c7f528c5e7364aecd22f0b9f7209f
          path: mall4j-upstream

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install uni-app dependencies
        working-directory: mall4j-upstream/front-end/mall4uni
        run: pnpm install --no-frozen-lockfile

      - name: Configure production API and image endpoints
        working-directory: mall4j-upstream/front-end/mall4uni
        env:
          MALL4J_API_BASE_URL: ${{ vars.MALL4J_API_BASE_URL }}
          MALL4J_RESOURCES_BASE_URL: ${{ vars.MALL4J_RESOURCES_BASE_URL }}
        run: |
          if [ -z "$MALL4J_API_BASE_URL" ] || [ -z "$MALL4J_RESOURCES_BASE_URL" ]; then
            echo "::error::Set MALL4J_API_BASE_URL and MALL4J_RESOURCES_BASE_URL repository variables before building a production APK."
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          values = {
              "VITE_APP_BASE_API": os.environ["MALL4J_API_BASE_URL"].rstrip("/"),
              "VITE_APP_RESOURCES_URL": os.environ["MALL4J_RESOURCES_BASE_URL"].rstrip("/") + "/",
          }
          for key, value in values.items():
              parsed = urlsplit(value)
              if parsed.scheme != "https" or not parsed.netloc or parsed.query or parsed.fragment or "'" in value or "example.com" in value:
                  raise SystemExit(key + " must be a real HTTPS URL without query or fragment")
          if not values["VITE_APP_RESOURCES_URL"].endswith("/mall4j/img/"):
              raise SystemExit("MALL4J_RESOURCES_BASE_URL must end with /mall4j/img/")
          path = Path(".env.production")
          content = path.read_text()
          for key, value in values.items():
              lines = content.splitlines()
              matches = [i for i, line in enumerate(lines) if line.strip().startswith(key + " =")]
              if len(matches) != 1:
                  raise SystemExit("Expected exactly one " + key + " in .env.production; found " + str(len(matches)))
              lines[matches[0]] = key + " = '" + value + "'"
              content = "\n".join(lines) + "\n"
          path.write_text(content)
          PY

      - name: Build Android App
        working-directory: mall4j-upstream/front-end/mall4uni
        run: pnpm run build:app-android

      - name: Locate generated APK
        id: apk
        run: |
          APK=$(find mall4j-upstream/front-end/mall4uni -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::The uni-app Android build did not produce an APK. This build environment may require the DCloud/HBuilderX native packaging toolchain."
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mall4j-android-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
