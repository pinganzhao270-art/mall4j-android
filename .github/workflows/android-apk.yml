name: Build Mall4j Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - develop/android-foundation
    paths:
      - ".github/workflows/android-apk.yml"
      - "mobile/**"

permissions:
  contents: read

concurrency:
  group: mall4j-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout app configuration
        uses: actions/checkout@v4

      - name: Checkout Mall4j upstream
        uses: actions/checkout@v4
        with:
          repository: gz-yami/mall4j
          ref: master
          path: mall4j-upstream

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install uni-app dependencies
        working-directory: mall4j-upstream/front-end/mall4uni
        run: pnpm install --no-frozen-lockfile

      - name: Configure production API endpoint
        working-directory: mall4j-upstream/front-end/mall4uni
        env:
          MALL4J_API_BASE_URL: ${{ vars.MALL4J_API_BASE_URL }}
        run: |
          if [ -z "$MALL4J_API_BASE_URL" ]; then
            echo "::error::Set repository variable MALL4J_API_BASE_URL to your deployed Mall4j API HTTPS URL before building a production APK."
            exit 1
          fi
          case "$MALL4J_API_BASE_URL" in
            https://*) ;;
            *) echo "::error::MALL4J_API_BASE_URL must use HTTPS."; exit 1 ;;
          esac
          sed -i "s#http://127.0.0.1:8086#${MALL4J_API_BASE_URL%/}#" .env.production

      - name: Build Android App
        working-directory: mall4j-upstream/front-end/mall4uni
        run: pnpm run build:app-android

      - name: Locate generated APK
        id: apk
        run: |
          APK=$(find mall4j-upstream/front-end/mall4uni -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::The uni-app Android build did not produce an APK. This build environment may require the DCloud/HBuilderX native packaging toolchain."
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mall4j-android-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
